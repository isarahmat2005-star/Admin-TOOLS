<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TOOLS MICRO — Admin Akses</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech&display=swap');

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Share Tech', sans-serif;
    background-color: #f1f5f9;
    background-image:
      linear-gradient(rgba(59,130,246,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.05) 1px, transparent 1px);
    background-size: 20px 20px;
    color: #1e293b;
  }

  /* ===================== ANIMASI TITIK JALAN ===================== */
  .dot-anim::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } 100% { content: ''; } }

  .card {
    width: 100%;
    max-width: 420px;
    margin: 24px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 0.5rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    padding: 28px;
  }

  .eyebrow {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #3b82f6;
    margin: 0 0 4px 0;
  }

  h1 {
    font-size: 20px;
    font-weight: bold;
    margin: 0 0 20px 0;
    color: #0f172a;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: bold;
    color: #475569;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .field { margin-bottom: 14px; }

  input[type="email"],
  input[type="text"],
  input[type="password"],
  select {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    text-align: center;
    border: 1px solid #cbd5e1;
    border-radius: 0.5rem;
    outline: none;
    background: #ffffff;
    color: #1e293b;
    transition: box-shadow 0.15s, border-color 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }
  input:focus, select:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 2px rgba(59,130,246,0.35);
  }
  input:disabled, select:disabled { background: #f1f5f9; color: #94a3b8; }

  .device-row { display: flex; gap: 8px; align-items: center; }
  .device-row input[type="text"] { flex: 1; }
  .unlimited-toggle {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: bold; color: #475569;
    white-space: nowrap; cursor: pointer; user-select: none;
  }

  button {
    width: 100%;
    padding: 11px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    color: #ffffff;
    background: #1e293b;
    border: none;
    border-radius: 0.5rem;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    transition: background 0.15s, opacity 0.15s;
    margin-top: 6px;
  }
  button:hover:not(:disabled) { background: #0f172a; }
  button:disabled { opacity: 0.5; cursor: default; }

  .msg {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 0.5rem;
    font-size: 13px;
    font-weight: bold;
    border: 1px solid transparent;
    display: none;
  }
  .msg.show { display: block; }
  .msg.success { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
  .msg.error { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }

  .hint {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 18px;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="card">
    <p class="eyebrow"></p>
    <h1>Tambah Akses Pengguna</h1>

    <div class="field">
      <label for="toolSelect">Tools</label>
      <select id="toolSelect"></select>
    </div>

    <div class="field">
      <label for="adminKey">Admin Key</label>
      <input type="password" id="adminKey" placeholder="Kunci rahasia admin" autocomplete="off" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="user@email.com" autocomplete="off" />
    </div>

    <!-- TAMBAHAN INPUT PASSWORD -->
    <div class="field">
      <label for="userPassword">Password Pengguna</label>
      <input type="text" id="userPassword" placeholder="Password untuk user ini" autocomplete="off" />
    </div>

    <div class="field">
      <label for="maxDevice">Max Device</label>
      <div class="device-row">
        <input type="text" id="maxDevice" placeholder="1" />
        <label class="unlimited-toggle">
          <input type="checkbox" id="unlimitedCheck" style="width:auto;" />
          Unlimited
        </label>
      </div>
    </div>

    <button id="submitBtn" onclick="submitUser()">Tambahkan Pengguna</button>

    <div class="msg" id="msgBox"></div>

    <p class="hint">
      Device ID pengguna akan terisi otomatis saat mereka login pertama kali dari aplikasi. Admin key tidak disimpan di browser — masukkan ulang setiap kali membuka halaman ini.
    </p>
  </div>

<script>
  // =====================================================================
  // KONFIGURASI TOOLS — daftar semua tools & URL Deployment GAS masing-masing.
  // >>> TAMBAH TOOLS BARU DI SINI <<<
  // Format: { name: "Nama Tampil", url: "URL Web App GAS" }
  // =====================================================================
  const TOOLS_CONFIG = [
    {
      name: "METAL",
      url: "https://script.google.com/macros/s/AKfycbxXFERsHCf2T7yzNMRk3NdbS_QFa7qIHHwCPROlR1k9q8J5YPeqFfKKMZkrFbxZiMRv/exec"
    },

    {
      name: "AMATI",
      url: "https://script.google.com/macros/s/AKfycbwWEc0qYjHShI3GzRWSMH8B2rPKME2AYZw6CS9WYX8A9H7rcb2jBrRmuxHFCVhcIled8g/exec"
    },

    {
      name: "GAS.BUBAR",
      url: "https://script.google.com/macros/s/AKfycbwUsyX74wxfkL9NXdYEiwc5NxsB_r0eAWLN2hdblph5DIXHtsUVEoP155DfoIWPKBKZYQ/exec"
    },
    {
      name: "PAGE",
      url: "https://script.google.com/macros/s/AKfycbxqySwiSsD46wwt1rYWSubz90V8MAthfGNmPVz1LxkDT9ZirZ_eR_s43BXBXFstqLXO3g/exec"
    },
    // {
    //   name: "NAMA_TOOLS_BARU",
    //   url: "https://script.google.com/macros/s/GANTI_DENGAN_URL_DEPLOYMENT_GAS/exec"
    // },
  ];
  // =====================================================================

  const toolSelect = document.getElementById('toolSelect');
  const unlimitedCheck = document.getElementById('unlimitedCheck');
  const maxDeviceInput = document.getElementById('maxDevice');

  // Isi dropdown Tools dari TOOLS_CONFIG
  TOOLS_CONFIG.forEach((tool, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = tool.name;
    toolSelect.appendChild(opt);
  });

  unlimitedCheck.addEventListener('change', () => {
    if (unlimitedCheck.checked) {
      maxDeviceInput.value = 'unlimited';
      maxDeviceInput.disabled = true;
    } else {
      maxDeviceInput.value = '';
      maxDeviceInput.disabled = false;
      maxDeviceInput.focus();
    }
  });

  function showMsg(text, type) {
    const box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg show ' + type;
  }

  async function submitUser() {
    const btn = document.getElementById('submitBtn');
    const selectedTool = TOOLS_CONFIG[toolSelect.value];
    const adminKey = document.getElementById('adminKey').value.trim();
    const email = document.getElementById('email').value.trim();
    const userPassword = document.getElementById('userPassword').value.trim(); // <-- AMBIL NILAI PASSWORD
    const maxDevice = maxDeviceInput.value.trim();

    if (!selectedTool) {
      showMsg('Tools belum dipilih / belum dikonfigurasi.', 'error');
      return;
    }
    // VALIDASI KOLOM PASSWORD
    if (!adminKey || !email || !userPassword || !maxDevice) {
      showMsg('Semua kolom wajib diisi.', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span>MENYIMPAN<span class="dot-anim" style="display:inline-block; width:12px; text-align:left;"></span></span>';

    try {
      const res = await fetch(selectedTool.url, {
        method: 'POST',
        mode: 'cors',                    // WAJIB: izinkan cross-origin
        redirect: 'follow',              // WAJIB: GAS sering redirect
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'  // GANTI dari application/json
        },
        // MENGIRIM PASSWORD KE GAS MELALUI PAYLOAD
        body: JSON.stringify({ action: 'add_user', adminKey, email, password: userPassword, maxDevice })
      });

      const data = await res.json();

      if (data.success) {
        showMsg(data.message || `Pengguna berhasil ditambahkan ke ${selectedTool.name}.`, 'success');
        document.getElementById('email').value = '';
        document.getElementById('userPassword').value = ''; // <-- KOSONGKAN PASSWORD SETELAH SUKSES
        maxDeviceInput.value = '';
        unlimitedCheck.checked = false;
        maxDeviceInput.disabled = false;
      } else {
        showMsg(data.message || 'Gagal menambahkan pengguna.', 'error');
      }
    } catch (err) {
      showMsg('Koneksi gagal: ' + err.message, 'error');
      console.error('Full error:', err);
    } finally {
      btn.disabled = false;
      btn.textContent = 'TAMBAHKAN USER';
    }
  }
</script>

</body>
</html>
